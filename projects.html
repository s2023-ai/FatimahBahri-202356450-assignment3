  <!-- Apply the saved theme BEFORE the page paints (prevents a white flash) -->
  <script>
    (function () {
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem("fb:theme")); } catch (e) {}
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <main class="page">
    <h1 class="page-title">MY <span class="script">WORKS</span></h1>

      A selection of individual and collaborative projects exploring design,

    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="Filter projects by category"></div>

  <!-- Image viewer (opened from the project thumbnails) -->

        <button class="btn" id="lightbox-next" type="button" aria-label="Next image">→</button>

    </div>
  </dialog>
